<style>
  /* צבעים - זהים לאפליקציה ב-Lovable */
  :root{
    --bg: oklch(0.982 0.018 75);
    --ink: oklch(0.19 0.03 290);
    --purple: oklch(0.54 0.25 290);
    --lime: oklch(0.9 0.21 123);
    --pink: oklch(0.68 0.23 355);
    --field: oklch(0.99 0.008 90);
    --muted: oklch(0.42 0.04 290);
    --card: #fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif}
  a{color:inherit}
  .page{min-height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}

  /* כותרת עליונה */
  .nav{display:flex;justify-content:space-between;align-items:center;padding:28px clamp(16px,4.5vw,64px);position:relative;z-index:5}
  .nav img{height:64px;width:auto;display:block}
  .nav-login{font-size:17px}
  .brutal-link{color:var(--purple);font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:4px;text-underline-offset:3px}

  /* אזור הפתיחה */
  .hero{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding:20px clamp(16px,6.5vw,96px) 80px;position:relative}
  .txt{position:relative;z-index:3}
  .tag{display:inline-block;background:var(--lime);border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-weight:800;font-size:16px;box-shadow:4px 4px 0 var(--ink)}
  h1{font-weight:900;font-size:clamp(52px,7vw,100px);line-height:1;margin-top:26px;letter-spacing:-1.5px}
  h1 span{display:inline-block;background:var(--purple);color:#fff;border:4px solid var(--ink);border-radius:22px;padding:0 .24em .1em;box-shadow:7px 7px 0 var(--ink);margin-top:12px;transform:rotate(-1.5deg)}
  .sub{font-size:clamp(18px,1.6vw,22px);line-height:1.55;margin-top:34px;max-width:500px;font-weight:500}
  .brutal-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:38px;height:66px;padding:0 50px;font-size:21px;font-weight:800;text-decoration:none;
    border:3px solid var(--ink);border-radius:16px;background:var(--purple);color:#fff;box-shadow:5px 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
  .brutal-btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .brutal-btn:active{transform:translate(5px,5px);box-shadow:none}
  .brutal-btn:focus-visible,.brutal-link:focus-visible{outline:none;box-shadow:0 0 0 5px var(--lime)}

  /* תצוגת המוצר */
  .visual{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center}
  .blob{position:absolute;border:3px solid var(--ink);border-radius:50%}
  .b1{width:min(640px,100%);aspect-ratio:1;background:var(--lime)}
  .b2{width:120px;height:120px;background:var(--pink);top:0;left:62%}
  .sq{position:absolute;width:90px;height:90px;background:var(--purple);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);bottom:10px;left:58%;transform:rotate(-12deg)}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
  .panel{position:relative;z-index:3;width:min(520px,92%);padding:26px}
  .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
  .ph b{font-size:26px;font-weight:900}
  .pill{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;font-weight:800;padding:4px 14px;font-size:15px;white-space:nowrap}
  .pill.add{background:var(--purple);color:#fff;padding:6px 16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;padding:14px 18px;margin-top:12px;background:var(--field)}
  .row b{font-size:20px;font-weight:800}
  .m{color:var(--muted);font-size:15px;margin-top:2px}
  .wait{background:var(--pink)}
  .track{background:var(--lime)}
  .alert{position:absolute;z-index:4;left:0;bottom:40px;width:330px;max-width:80%;padding:16px 20px;background:var(--pink);transform:rotate(-4deg)}
  .alert b{font-weight:900;font-size:19px;display:block}
  .alert span{font-weight:500;display:block;margin-top:4px}

  @keyframes pop-in{
    0%{opacity:0;transform:translateY(24px) scale(.85) rotate(var(--rot,0deg))}
    60%{opacity:1;transform:translateY(-6px) scale(1.04) rotate(var(--rot,0deg))}
    100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--rot,0deg))}
  }
  .pop{animation:pop-in .6s cubic-bezier(.3,1.4,.5,1) both}
  .alert.pop{--rot:-4deg;animation-delay:.35s}
  @media (prefers-reduced-motion:reduce){.pop{animation:none}}

  /* מובייל וטאבלט */
  @media (max-width:900px){
    .nav img{height:48px}
    .nav-login{font-size:15px}
    .hero{grid-template-columns:1fr;padding:8px 16px 56px;gap:24px;text-align:center}
    .sub{margin-inline:auto}
    .visual{min-height:auto;padding:30px 0 60px}
    .b1{width:110%;max-width:520px}
    .b2{width:80px;height:80px;left:auto;right:0}
    .sq{width:64px;height:64px;left:6%;bottom:8px}
    .panel{padding:18px;text-align:right}
    .ph b{font-size:21px}
    .row{padding:12px 14px}
    .row b{font-size:17px}
    .alert{bottom:0;left:4%;width:280px;text-align:right}
